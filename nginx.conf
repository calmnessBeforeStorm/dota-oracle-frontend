# Static files only.
#
# Routing /api and /ws is Caddy's job in production, and it used to be described here too.
# Two copies of the same routing table drift, and the copy nobody looks at is the one that
# rots - so this file no longer mentions the API at all. Nothing reaches this container
# except Caddy, over the compose network.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed by Vite at build time, so the name changes whenever the bytes do and the file
    # can be cached forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cached, by contrast: it is the file that names the current bundle, and a stale
    # copy leaves a browser asking the new API for the old assets after every deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA: an unknown path is a client route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Not a page, and nothing outside should be told what serves this.
    server_tokens off;
}
