name: Publish

# Builds the SPA image and pushes it to ghcr, so the server pulls a finished artifact and
# needs neither Node nor a checkout.
#
# Only `main`. Production runs what is on main, and publishing from every branch would make
# `:main` a moving target that occasionally pointed at unreviewed work.
on:
  push:
    branches: [main]
  # For rebuilding a tag without an empty commit.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only write this job gets. It cannot push to the repository, only to the registry.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `github.repository_owner` keeps its original capitalisation, and a registry
      # rejects that outright: "repository name must be lowercase". The build fails
      # before it pushes, so the symptom is no image at all rather than a wrong one.
      # `${VAR,,}` is bash's lowercase expansion.
      - name: Lowercase the owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Issued for this run and expires with it - no long-lived token sitting in the
          # repository settings to rotate or to leak from them.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Two tags on the same build, and the SHA is the important one: the API image
          # carries the matching SHA, and the deploy pins both to it. That is what keeps a
          # split SPA and API from drifting apart between releases.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dota-oracle-frontend:main
            ${{ env.REGISTRY }}/${{ env.OWNER }}/dota-oracle-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
